services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-arc_db}
      POSTGRES_USER: ${DB_USERNAME:-arc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arc_pass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-arc_user} -d ${DB_NAME:-arc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container: creates the S3 bucket then exits
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://storage:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
        mc mb --ignore-existing local/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secret}
      S3_BUCKET: ${S3_BUCKET:-arc-documents}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-arc_db}
      DB_USERNAME: ${DB_USERNAME:-arc_user}
      DB_PASSWORD: ${DB_PASSWORD:-arc_pass}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-arc-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secret}
      AUTH_MODE: ${AUTH_MODE:-otp}
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../prototype-next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
