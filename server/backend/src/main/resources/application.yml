server:
  port: 8080

spring:
  application:
    name: arc-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arc_db}
    username: ${DB_USERNAME:arc_user}
    password: ${DB_PASSWORD:arc_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

arc:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:arc-documents}
    access-key: ${S3_ACCESS_KEY:minio_access}
    secret-key: ${S3_SECRET_KEY:minio_secret}
    region: ap-northeast-2
