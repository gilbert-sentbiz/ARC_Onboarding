server:
  port: 8080

spring:
  application:
    name: arc-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arc_db}
    username: ${DB_USERNAME:arc_user}
    password: ${DB_PASSWORD:arc_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
