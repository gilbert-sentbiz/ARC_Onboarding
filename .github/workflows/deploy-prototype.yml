name: Deploy Prototype to GitHub Pages

# 자동 배포는 mvp 브랜치에서만 (main = Full Spec 개발 라인, 배포 안 함)
# 수동 배포가 필요하면 workflow_dispatch 사용
on:
  push:
    branches:
      - mvp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototype-next/package-lock.json

      - name: Install dependencies
        working-directory: prototype-next
        run: npm ci

      - name: Build
        working-directory: prototype-next
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype-next/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
