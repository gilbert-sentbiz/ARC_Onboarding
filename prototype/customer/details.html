<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC 온보딩 - 상세 정보 입력</title>
    <link rel="stylesheet" href="../../design_system/colors_and_type.css" />
    <link rel="stylesheet" href="./customer.css" />
  </head>
  <body>
    <div class="customer-shell">
      <header class="customer-header">
        <img class="customer-header__logo" src="../../design_system/assets/logos/wordmark-dark.svg" alt="센트비즈" />
        <span class="customer-header__badge">고객용 프로토타입</span>
      </header>

      <main class="survey-layout">
        <section class="survey-panel">
          <div class="survey-panel__header">
            <div>
              <p class="eyebrow">페이지 03</p>
              <h1>추가 정보 입력</h1>
              <p class="survey-panel__copy">이어서 필요한 정보를 입력해주세요.</p>
            </div>
            <a class="button button--secondary" href="./survey.html">이전</a>
          </div>

          <section class="survey-card">
            <div class="card-header-inline">
              <h2>입력 항목</h2>
            </div>
            <div class="detail-section-list" id="detail-section-list"></div>
          </section>

          <section class="survey-card">
            <div class="card-header-inline">
              <h2>세부 항목</h2>
            </div>
            <div class="detail-fields" id="detail-fields"></div>
          </section>

          <div class="survey-footer">
            <a class="button button--secondary" href="./survey.html">설문으로 돌아가기</a>
            <button class="button button--primary" type="button">다음: 서류 업로드</button>
          </div>
        </section>
      </main>
    </div>

    <script src="./customer.js"></script>
  </body>
</html>
