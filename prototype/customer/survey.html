<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC 온보딩 - 최초 설문</title>
    <link rel="stylesheet" href="../../design_system/colors_and_type.css" />
    <link rel="stylesheet" href="./customer.css" />
  </head>
  <body>
    <div class="customer-shell">
      <header class="customer-header">
        <img class="customer-header__logo" src="../../design_system/assets/logos/wordmark-dark.svg" alt="센트비즈" />
        <span class="customer-header__badge">고객용 프로토타입</span>
      </header>

      <main class="survey-layout">
        <section class="survey-panel">
          <div class="survey-panel__header">
            <div>
              <p class="eyebrow">페이지 02</p>
              <h1>최초 설문</h1>
              <p class="survey-panel__copy">
                고객이 처음 입력해야 하는 필드를 한 화면에 모았다. 입력값에 따라 이후 상세 정보와
                제출 서류가 달라진다.
              </p>
            </div>
            <a class="button button--secondary" href="./login.html">이전</a>
          </div>

          <form class="survey-form">
            <section class="survey-card">
              <div class="card-header-inline">
                <h2>기본 정보 입력</h2>
                <span class="status-chip">최초 설문</span>
              </div>
              <div class="survey-fields-grid">
                <label class="field">
                  <span>서비스 유형</span>
                  <select id="service-type">
                    <option value="collection">수금</option>
                    <option value="payout">지급</option>
                  </select>
                </label>
                <label class="field">
                  <span id="country-label">수금 국가</span>
                  <select id="service-country">
                    <option value="KR">한국 (KRW)</option>
                    <option value="VN">베트남 (VND)</option>
                    <option value="ID">인도네시아 (IDR)</option>
                  </select>
                </label>
                <label class="field">
                  <span>엔터티 유형</span>
                  <select id="entity-type">
                    <option value="corporate">법인</option>
                    <option value="individual">개인사업자</option>
                    <option value="fi">금융기관</option>
                  </select>
                </label>
                <label class="field">
                  <span>설립 국가</span>
                  <select id="incorporation-country">
                    <option value="KR">KR</option>
                    <option value="CN">CN</option>
                    <option value="HK">HK</option>
                    <option value="VN">VN</option>
                  </select>
                </label>
                <label class="field">
                  <span>회사명</span>
                  <input type="text" placeholder="회사명을 입력하세요" />
                </label>
                <label class="field">
                  <span>직함</span>
                  <input type="text" placeholder="직함을 입력하세요" />
                </label>
                <label class="field">
                  <span>이름</span>
                  <input type="text" placeholder="이름을 입력하세요" />
                </label>
                <label class="field">
                  <span>전화번호</span>
                  <input type="tel" placeholder="전화번호를 입력하세요" />
                </label>
                <label class="field">
                  <span>이메일</span>
                  <input type="email" value="merchant@sample.com" />
                </label>
                <label class="field">
                  <span>유입 경로</span>
                  <input type="text" placeholder="유입 경로" />
                </label>
                <label class="field">
                  <span>예상 거래 규모</span>
                  <select>
                    <option>월 1억원 미만</option>
                    <option>월 1억~10억원</option>
                    <option>월 10억원 이상</option>
                  </select>
                </label>
                <label class="field">
                  <span>거래 건수</span>
                  <select>
                    <option>월 100건 미만</option>
                    <option>월 100~1,000건</option>
                    <option>월 1,000건 이상</option>
                  </select>
                </label>
                <label class="field field--full">
                  <span>기타 문의사항</span>
                  <textarea rows="4" placeholder="추가로 전달할 내용을 입력하세요"></textarea>
                </label>
                <label class="field field--checkbox field--full">
                  <input type="checkbox" checked />
                  <span>개인정보 수집 및 이용 동의</span>
                </label>
              </div>
            </section>

            <div class="survey-footer">
              <a class="button button--primary" id="go-to-details" href="./details.html">다음: 상세 정보 입력</a>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="./customer.js"></script>
  </body>
</html>
